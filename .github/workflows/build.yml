
name: Mogbot Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: mogbot-windows-x64
          path: target/release/tgbot.exe

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: mogbot-linux-x64
          path: target/release/tgbot

  android:
    name: Android ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build
        run: |
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a build --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
      - uses: actions/upload-artifact@v4
        with:
          name: mogbot-android-arm64
          path: target/aarch64-linux-android/release/tgbot

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
